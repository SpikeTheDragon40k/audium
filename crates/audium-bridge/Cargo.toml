[package]
name = "audium_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
audium-core.workspace = true
audium-library.workspace = true
audium-storage.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[build-dependencies]
cxx-qt-build.workspace = true

# The CXX-Qt bridge macros expand to FFI glue that uses `unsafe` internally, so this
# crate cannot inherit the workspace-wide `unsafe_code = "deny"`. Hand-written
# `unsafe` is still not allowed here without a `// SAFETY:` justification.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
